name: Linters

# ruff (format and lint) and mypy via pre-commit, see .pre-commit-config.yaml.
# No GPU or CUDA build is needed: mypy types the compiled extension from the
# stubs in src/phipict/*.pyi, and CPU torch is enough for the rest.
on:
  # Manually triggerable in github
  workflow_dispatch:

  # When a push occurs on either of these branches
  push:
    branches:
      - main

  # When a push occurs on a PR that targets these branches
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linters:
    name: "Python 3.11"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The mypy hook runs in this environment (repo: local), so it needs the
      # runtime dependencies (setup.py) and the stubs of the dev extra. Not
      # `pip install .[dev]`, which would compile the CUDA extension.
      - name: Install linters and dependencies
        run: |
          python -m pip install --upgrade pip
          # the torch version of the PyPI wheels (DEFAULT_TORCH in release.yml)
          pip install "torch==2.10.*" --index-url https://download.pytorch.org/whl/cpu
          pip install pre-commit mypy==1.19.1 types-setuptools types-psutil \
            scipy-stubs numpy scipy "pyamg>=4.0" "matplotlib>=3.9" imageio psutil

      - name: Run pre-commit (all files)
        run: pre-commit run --all-files --show-diff-on-failure
