name: Release

# Manual only (Actions -> Release -> Run workflow). Builds the PyPI wheels, one
# per Python version, for the default torch/CUDA combination below. Other
# combinations are not published; users build those from source.
#
# To publish, run it on a tag vX.Y.Z (select the tag instead of a branch) with
# target testpypi or pypi; the tag must match VERSION in setup.py. TestPyPI and
# PyPI are separate registries, so the exact release version can be tested on
# TestPyPI first. A file name can only be uploaded once; to retry on TestPyPI,
# set build_number (phipict-0.1.0-1-cp312-...whl); never used for PyPI.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Upload the default wheels to"
        type: choice
        options: [none, testpypi, pypi]
        default: none
      build_number:
        description: "Wheel build number for TestPyPI retries (empty = none)"
        type: string
        default: ""

permissions:
  contents: read

# Combination published to (Test)PyPI. It must
# match the CUDA build of the torch wheel on PyPI, since `pip install phipict` pulls torch from PyPI:
# torch <= 2.10 on PyPI is built with CUDA 12.8, torch >= 2.11 with CUDA 13.0
# (needs driver >= 580). 2.10 is the newest torch that runs on 570 drivers.
env:
  DEFAULT_TORCH: "2.10"
  DEFAULT_CUDA: "12.8"
  DEFAULT_CUDA_TAG: cu128
  DEFAULT_ARCH_LIST: "8.0;9.0;10.0;12.0+PTX"

jobs:
  # Fails before the (long) builds if the run cannot be published.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check ref and inputs
        env:
          TARGET: ${{ inputs.target }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [[ -n $BUILD_NUMBER ]]; then
            [[ $BUILD_NUMBER =~ ^[0-9]+$ ]] || { echo "::error::build_number must be a number"; exit 1; }
            [[ $TARGET == testpypi ]] || { echo "::error::build_number is only for TestPyPI retries"; exit 1; }
          fi
          [[ $TARGET == none ]] && exit 0
          [[ $GITHUB_REF == refs/tags/v* ]] || { echo "::error::publishing needs a vX.Y.Z tag; select it in Run workflow"; exit 1; }
          version=$(sed -nE 's/^VERSION = "(.+)"/\1/p' setup.py)
          [[ v$version == "$GITHUB_REF_NAME" ]] || { echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version in setup.py"; exit 1; }

  build-default:
    needs: check
    name: ${{ matrix.python }} default (PyPI)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python: [cp311, cp312, cp313]
    steps:
      - uses: actions/checkout@v5

      # The CUDA toolkit, torch (for the build and again in cibuildwheel's test
      # venv) and the Docker image do not fit into the default free disk space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/share/powershell
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          sudo apt-get clean
          sudo docker image prune --all --force
          df -h /

      # Pin torch==X.Y.*, since the extension is ABI-bound to the torch minor
      # version.
      - uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_BUILD: ${{ matrix.python }}-manylinux_x86_64
          TORCH_VERSION: ${{ env.DEFAULT_TORCH }}
          CUDA_VERSION: ${{ env.DEFAULT_CUDA }}
          CUDA_TAG: ${{ env.DEFAULT_CUDA_TAG }}
          TORCH_CUDA_ARCH_LIST: ${{ env.DEFAULT_ARCH_LIST }}
          PHIPICT_PIN_TORCH: "1"
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-${{ matrix.python }}
          path: wheelhouse/*.whl

  publish:
    if: inputs.target != 'none'
    needs: build-default
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted publishing: this repo/workflow/environment is registered as a
    # publisher on test.pypi.org (environment testpypi) and pypi.org
    # (environment pypi), see CI.md; no token needed.
    environment:
      name: ${{ inputs.target }}
      url: https://${{ inputs.target == 'testpypi' && 'test.' || '' }}pypi.org/p/phipict
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: pypi-wheel-*
          path: dist
          merge-multiple: true

      - name: Set wheel build number
        if: inputs.build_number != ''
        run: pipx run wheel tags --remove --build "${{ inputs.build_number }}" dist/*.whl

      - name: Check version against tag
        run: |
          for f in dist/*; do
            case ${f#dist/} in
              phipict-${GITHUB_REF_NAME#v}-*.whl | phipict-${GITHUB_REF_NAME#v}.tar.gz) ;;
              *) echo "::error::$f does not match tag $GITHUB_REF_NAME"; exit 1 ;;
            esac
          done
          ls dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # a file name can only be uploaded once; re-runs skip the uploaded ones
          skip-existing: true
