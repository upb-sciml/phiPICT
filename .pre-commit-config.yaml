repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff-format
        files: ^(src|tests)/
      - id: ruff-check
        files: ^(src|tests)/
        args: [ --fix ]

  # mypy from the active environment (repo: local), not an isolated one: the
  # package is typed against torch, numpy and scipy, which must be installed.
  # Checks the whole package as configured in [tool.mypy] of pyproject.toml.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
